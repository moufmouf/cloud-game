<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>Arcade cabinet</title>
    <!--
        One game shared by whoever opens the same cabinet, see CABINET.md:
        cabinet.html?cabinet=<globally unique name>&game=<ROM name>&players=<1 to 4>&volume=<0 to 100>
        The worker hands out the player slots, everyone else watches.
    -->
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
            color: #fff;
            font: 14px/1.4 system-ui, sans-serif;
        }

        body {
            display: grid;
            place-items: center;
        }

        /* letterboxed in whatever shape the iframe has, never rotated, sharp pixels */
        #stream {
            --a: 4/3;
            width: min(100vw, calc(100vh * (var(--a))));
            aspect-ratio: var(--a);
            object-fit: fill;
            image-rendering: pixelated;
        }

        .corner {
            position: fixed;
            top: 8px;
            display: flex;
            gap: 6px;
        }

        .pill {
            display: flex;
            align-items: center;
            height: 24px;
            box-sizing: border-box;
            padding: 0 10px;
            border-radius: 12px;
            background: #0009;
            font-weight: 600;
        }

        #badge {
            left: 8px;
        }

        #badge.player {
            color: #000;
        }

        #tools {
            right: 8px;
        }

        /* the slider opens on hover, the speaker mutes */
        #sound > span {
            display: flex;
            width: 0;
            overflow: hidden;
            transition: width .15s;
        }

        #sound:hover > span, #sound:focus-within > span {
            width: 86px;
        }

        #volume {
            width: 80px;
            margin: 0 6px 0 0;
            accent-color: #fff;
        }

        #mute {
            all: unset;
            display: flex;
            cursor: pointer;
        }

        #sound[data-level="0"] .wave, #sound[data-level="1"] .wave2, #sound:not([data-level="0"]) .cross {
            display: none;
        }

        #help {
            position: relative;
            cursor: default;
        }

        #help > div {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 6px;
            padding: 8px 12px;
            border-radius: 8px;
            background: #000c;
            font-weight: normal;
            white-space: nowrap;
        }

        #help:hover > div {
            display: block;
        }

        .other-layout {
            opacity: .7;
        }

        #hint {
            position: fixed;
            max-width: min(80vw, 480px);
            text-align: center;
            padding: 8px 16px;
            border-radius: 8px;
            background: #000a;
            font-size: 18px;
            pointer-events: none;
        }
    </style>
</head>
<body>
<video id="stream" playsinline></video>
<div id="badge" class="corner pill">Connecting…</div>
<div id="tools" class="corner">
<div id="sound" class="pill">
    <span><input id="volume" type="range" min="0" max="100" aria-label="Volume"></span>
    <button id="mute" aria-label="Mute">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 6h2.5L8 3v10L4.5 10H2z" fill="currentColor"/>
            <path class="wave" d="M10.5 6a3 3 0 0 1 0 4"/>
            <path class="wave wave2" d="M12.5 4a6 6 0 0 1 0 8"/>
            <path class="cross" d="M10.5 6l4 4m0-4l-4 4"/>
        </svg>
    </button>
</div>
<div id="help" class="pill">?
    <div>
        <b>Arrows</b> move<br>
        <!-- keys are bound by position: cabinet.js puts the player's own letters here when the browser tells it -->
        <b data-codes="KeyZ KeyX KeyC KeyV">Z X C V</b> A B X Y <span class="other-layout">(AZERTY: W X C V)</span><br>
        <b data-codes="KeyA KeyS">A S</b> L R <span class="other-layout">(AZERTY: Q S)</span><br>
        <b>Enter</b> Start, <b>Shift</b> Select<br>
        or a gamepad
    </div>
</div>
</div>
<div id="hint" hidden></div>

<script type="importmap">
    {
      "imports": {
        "api": "./js/api.js?v=3",
        "event": "./js/event.js?v=3",
        "input": "./js/input/keys.js?v=3",
        "log": "./js/log.js?v=3",
        "network": "./js/network/network.js?v=3"
      }
    }
</script>
<script type="module" src="js/cabinet.js?v=3"></script>
</body>
</html>
